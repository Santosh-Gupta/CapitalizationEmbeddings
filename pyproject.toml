[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "capitalization-embeddings"
version = "0.1.0"
description = "Experiments with factorized capitalization embeddings for BERT-style models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Santosh Gupta" }]
dependencies = [
  "accelerate>=0.30.0",
  "datasets>=2.19.0",
  "evaluate>=0.4.0",
  "seqeval>=1.2.2",
  "torch>=2.2.0",
  "transformers>=4.40.0",
]

[tool.setuptools.packages.find]
include = ["capitalization_embeddings*"]
